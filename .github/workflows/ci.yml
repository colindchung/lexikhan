name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Build Lambda asset
        run: python scripts/build_lambda.py
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
      - name: Synthesize development stack
        run: npx --yes aws-cdk@2 synth -c stage=dev
