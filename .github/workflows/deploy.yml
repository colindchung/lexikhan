name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      stage:
        description: Environment to deploy
        required: true
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy ${{ github.event_name == 'workflow_dispatch' && inputs.stage || 'dev' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.stage || 'dev' }}
    concurrency:
      group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.stage || 'dev' }}
      cancel-in-progress: false
    env:
      DEPLOY_STAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.stage || 'dev' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Verify deployment input
        run: |
          ruff check .
          pytest
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - name: Deploy stack
        run: >-
          npx --yes aws-cdk@2 deploy
          -c stage="$DEPLOY_STAGE"
          -c account="${{ vars.AWS_ACCOUNT_ID }}"
          -c region="${{ vars.AWS_REGION }}"
          --require-approval never
