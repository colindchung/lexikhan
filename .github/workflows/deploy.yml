name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy personal production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: personal
    concurrency:
      group: deploy-personal-production
      cancel-in-progress: false
    env:
      DEPLOY_STAGE: prod
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Build Lambda asset
        run: python scripts/build_lambda.py
      - name: Verify deployment input
        run: |
          ruff check .
          pytest
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - name: Verify AWS target
        run: aws sts get-caller-identity
      - name: Deploy stack
        run: >-
          npx --yes aws-cdk@2 deploy --all
          -c stage="$DEPLOY_STAGE"
          -c account="${{ vars.AWS_ACCOUNT_ID }}"
          -c region="${{ vars.AWS_REGION }}"
          --ci
          --outputs-file cdk-outputs.json
          --require-approval never
