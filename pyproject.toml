[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lexikhan"
version = "0.1.0"
description = "Lexikhan serverless API and scheduled worker"
requires-python = ">=3.12"
dependencies = [
    "aws-cdk-lib==2.266.0",
    "constructs==10.8.1",
    "boto3==1.43.105",
    "fsrs==6.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "moto[dynamodb]==5.2.3",
    "ruff==0.16.4",
]

[tool.setuptools]
packages = ["infra"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
